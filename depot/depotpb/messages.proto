syntax = "proto3";

package depotpb;

message OrderItem {
  string product_id = 1;
  string store_id = 2;
  int32 quantity = 3;
}

message ShoppingList {
  string id = 1;
  string order_id = 2;
  repeated Item items = 3;
  string assigned_bot_id = 4;
  string status = 5;
}

message Item {
  string product_name = 1;
  int32 quantity = 2;
}
